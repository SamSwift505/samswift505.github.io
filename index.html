<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Samuel Swift's Famous Website</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Futura, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 10px;
        }

        p {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        hr {
            border: none;
            height: 8px;
            background-color: red;
            width: 90%;
            margin: 40px auto;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
            padding: 20px;
        }

        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            max-width: 350px;
        }

        nav img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* Mobile layout */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 30px;
                padding: 10px;
            }

            nav a {
                font-size: 20px;
            }

            nav img {
                max-width: 250px;
            }

            p {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>
    <a href="img/websiteheader.GIF">
     <img src="img/websiteheader.GIF" alt="header"> 
    </a>

        Hello, my name is Samuel Swift and I am a printmaker, epidemiologist and skateboarder.
        <a href="mailto:samuelswift85@gmail.com">Contact me here</a>
    </p>

    <hr>

    <nav>
        <a href="printmaking.html">
            <img src="img/wr_print_crop.JPG" alt="printmaking">
            <span>Printmaking</span>
        </a>

        <a href="otherart.html">
            <img src="img/map_crop.JPG" alt="other art projects">
            <span>Other art projects</span>
        </a>

        <a href="https://www.youtube.com/@samuelswift4795">
            <img src="img/wryoutube.JPG" alt="youtube">
            <span>Animation / Skating</span>
        </a>
    </nav>

    <hr>

</body>
</html>
